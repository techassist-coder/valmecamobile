<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Val'Meca Mobile</title>
    <link rel="icon" href="assets/images/logos/logo_mini.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="index.html" class="logo-link">
                <img src="assets/images/logos/logo.png" alt="Val'Meca Mobile" class="logo-desktop">
                <img src="assets/images/logos/logo_mini.png" alt="Val'Meca Mobile" class="logo-mobile">
            </a>

            <nav>
                <button class="nav-toggle" aria-label="Ouvrir le menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <ul class="nav-menu">
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="index.html#services">Services</a></li>
                    <li><a href="contact.html" class="is-active">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="section">
            <div class="container">
                <h1 class="section-title reveal">Nous <span>contacter</span></h1>

                <div class="contact-info reveal">
                    <div>
                        <h3>Téléphone</h3>
                        <p>06 00 00 00 00</p>
                    </div>
                    <div>
                        <h3>Email</h3>
                        <p>contact@valmecamobile.fr</p>
                    </div>
                    <div>
                        <h3>Zone d'intervention</h3>
                        <p>Var (83)</p>
                    </div>
                </div>

                <form class="contact-form reveal reveal-delay-1">
                    <div class="form-group">
                        <label for="name">Nom</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Téléphone</label>
                        <input type="tel" id="phone" name="phone">
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Envoyer</button>

                    <p class="form-status" aria-live="polite"></p>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Val'Meca Mobile - Mécanique automobile à domicile · <span class="site-version"></span></p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>

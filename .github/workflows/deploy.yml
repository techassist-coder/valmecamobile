# =====================================================================
# Déploiement automatique vers l'hébergement OVH par FTP
# =====================================================================
# Pourquoi ce fichier : l'option « Lier un dépôt Git » d'OVH n'est pas
# disponible sur l'offre d'hébergement gratuite. Ce workflow fait la même
# chose gratuitement : à chaque push sur la branche main, GitHub envoie
# les fichiers modifiés vers le serveur OVH.
#
# ---------------------------------------------------------------------
# AVANT LA PREMIÈRE UTILISATION, créer 3 secrets sur GitHub :
#   Dépôt > Settings > Secrets and variables > Actions > New repository secret
#
#   FTP_SERVER    le nom d'hôte SEUL, recopié depuis l'espace client OVH
#                 (Hébergement > onglet FTP-SSH > colonne "Serveur FTP").
#                 Il ressemble à ftp.clusterNNN.hosting.ovh.net, où NNN est
#                 le numéro de VOTRE cluster : ne recopiez jamais un exemple
#                 générique, il ne se résoudrait pas en DNS.
#                 Sans "ftp://", sans port, sans barre oblique finale.
#   FTP_USERNAME  l'identifiant FTP affiché sur la même page
#   FTP_PASSWORD  le mot de passe FTP
#
# Ces valeurs sont chiffrées par GitHub. Ne JAMAIS les écrire dans un
# fichier du dépôt.
# =====================================================================

name: Déploiement OVH

on:
  # Déploie automatiquement à chaque envoi sur main
  push:
    branches: [main]
  # Permet aussi de lancer un déploiement à la main depuis l'onglet Actions
  workflow_dispatch:

# Empêche deux déploiements simultanés d'écrire en même temps sur le serveur
concurrency:
  group: deploiement-ovh
  cancel-in-progress: false

jobs:
  deployer:
    name: Envoyer les fichiers vers OVH
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier que le mode réglage de l'intro est bien désactivé
        # Garde-fou : refuse de mettre en ligne si MODE_REGLAGE est resté à
        # true, ce qui ferait rejouer l'animation à chaque page.
        #
        # On isole la ligne de DÉCLARATION (^ const MODE_REGLAGE =) au lieu
        # de chercher la chaîne "MODE_REGLAGE = true" n'importe où : cette
        # chaîne apparaît aussi dans le commentaire qui documente la
        # variable, ce qui déclenchait un faux positif et bloquait le
        # déploiement alors que la valeur était bien false.
        run: |
          declaration=$(grep -E '^[[:space:]]*const[[:space:]]+MODE_REGLAGE[[:space:]]*=' js/main.js | head -1)

          if [ -z "$declaration" ]; then
            echo "::error file=js/main.js::Déclaration de MODE_REGLAGE introuvable. Le garde-fou ne peut plus rien vérifier : déploiement annulé."
            exit 1
          fi

          echo "Déclaration trouvée :$declaration"

          if echo "$declaration" | grep -q 'true'; then
            echo "::error file=js/main.js::MODE_REGLAGE est à true : l'intro se rejouerait à chaque chargement. Déploiement annulé."
            exit 1
          fi

          echo "MODE_REGLAGE est bien à false."

      - name: Vérifier la syntaxe du PHP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
          php -l contact.php

      - name: Vérifier la syntaxe du JavaScript
        run: node --check js/main.js

      - name: Vérifier le paramétrage du serveur FTP
        # Le transfert échouait sur "getaddrinfo ENOTFOUND ***", un message
        # illisible car GitHub masque la valeur du secret. Ces contrôles
        # produisent à la place un diagnostic précis, sans jamais afficher
        # le secret lui-même.
        # La valeur passe par une variable d'environnement plutôt que par
        # une interpolation directe dans le script : cela évite qu'un
        # contenu inattendu soit interprété par le shell.
        env:
          HOTE_FTP: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$HOTE_FTP" ]; then
            echo "::error::Le secret FTP_SERVER est vide ou n'existe pas. À créer dans Settings > Secrets and variables > Actions."
            exit 1
          fi

          if printf '%s' "$HOTE_FTP" | grep -qiE '^[a-z]+://'; then
            echo "::error::FTP_SERVER contient un préfixe de protocole (ftp:// ou sftp://). Ne mettre que le nom d'hôte."
            exit 1
          fi

          if printf '%s' "$HOTE_FTP" | grep -q '[/:]'; then
            echo "::error::FTP_SERVER contient une barre oblique ou un numéro de port. Ne mettre que le nom d'hôte."
            exit 1
          fi

          if printf '%s' "$HOTE_FTP" | grep -qE 'cluster0?XX|NNN|exemple|example'; then
            echo "::error::FTP_SERVER contient encore un exemple générique (XX, NNN...). Recopier la valeur réelle depuis OVH > Hébergement > FTP-SSH."
            exit 1
          fi

          # getent ahosts interroge les deux familles d'adresses, IPv4 et
          # IPv6. La commande est toujours présente sur un runner Ubuntu.
          if ! getent ahosts "$HOTE_FTP" > /dev/null 2>&1; then
            echo "::error::Le nom d'hôte de FTP_SERVER ne se résout pas en DNS. C'est la cause de l'erreur getaddrinfo ENOTFOUND. Vérifier la valeur dans OVH > Hébergement > onglet FTP-SSH."
            exit 1
          fi

          echo "Nom d'hôte FTP valide et résolu en DNS."

      - name: Transférer par FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS = FTP chiffré. Si OVH refuse la connexion, remplacer par
          # « ftp » (moins sûr : le mot de passe circule en clair).
          protocol: ftps
          # Racine du site sur l'hébergement OVH
          server-dir: ./www/
          local-dir: ./
          # Ne pas envoyer ce qui n'a rien à faire sur le serveur
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/*.md
            **/.DS_Store
            **/Thumbs.db

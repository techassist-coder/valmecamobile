<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Val'Meca Mobile - Site en construction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .logo {
            max-width: 500px;
            width: 100%;
            height: auto;
            margin-bottom: 40px;
        }

        h1 {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
        }

        h1 span {
            color: #e10600;
        }

        p {
            font-size: 1.1rem;
            color: #ccc;
            max-width: 500px;
            line-height: 1.6;
        }

        .bar {
            width: 80px;
            height: 3px;
            background: #e10600;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <img src="logo.png" alt="Val'Meca Mobile" class="logo">
    <h1>Site en <span>construction</span></h1>
    <div class="bar"></div>
    <p>Notre nouveau site arrive bientôt. Mécanique automobile à domicile, on s'occupe de tout !</p>
</body>
</html>
